server {
    # Port 443 with SSL activated
    listen 443 ssl;
    listen [::]:443 ssl;
    
    # domain name
    server_name miparis.42.fr;

    # Paths to certificate that we generate with Dockerfile
    ssl_certificate /etc/ssl/certs/inception.crt;
    ssl_certificate_key /etc/ssl/private/inception.key;
    
    # TLS protocols as requested
    ssl_protocols TLSv1.2 TLSv1.3;

    # Path to WordPress (vía volumen)
    root /var/www/wordpress;
    index index.php index.html index.htm;

    #try to open file directty or return error 404 upon fail
    location / {
        try_files $uri $uri/ =404;
    }

    # If petition is a PHP file, pass it to WordPress via 9000 port
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass wordpress:9000;
    }
}